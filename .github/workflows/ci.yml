name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # F06/G1: real Pi npm shim is acceptance coverage; pin the version verified locally.
      - name: Install real Pi CLI
        shell: pwsh
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.0
      - name: Full gate (model + integration + WPF + prototype + browser)
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build production package and check portable entry
        shell: powershell
        run: ./scripts/build.ps1 -Output artifacts/ci-preview
      - name: Check production F12 and Enter in real Terminal
        shell: powershell
        run: ./scripts/test-production-pane.ps1 -PackageDirectory artifacts/ci-preview
      - name: Preserve gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics
          path: |
            artifacts/ci-diagnostics
            artifacts/ui/*.json
            artifacts/prototype-browser-results.json
            artifacts/prototype-browser-stderr.log
            artifacts/ci-preview/distribution.json
            artifacts/production-pane-*/result.json
          if-no-files-found: ignore
