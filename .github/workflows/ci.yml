name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # F06/G1: real Pi npm shim is acceptance coverage; pin the version verified locally.
      - name: Install real Pi CLI
        shell: pwsh
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.0
      - name: Full gate (model + integration + WPF + prototype + browser)
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Real Omp pre-tool memory backpressure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:RUNNER_TEMP 'omp-memory-guard.exe'
          Invoke-WebRequest 'https://github.com/can1357/oh-my-pi/releases/download/v18.20.0/omp-windows-x64.exe' -OutFile $tool
          $expected = '1b6c7bda8241bc7d948495539f90ec47e6f30d1fec72b6ee097a67a1fc8d8e48'
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Omp release SHA256 mismatch' }
          node scripts/test-omp-memory-guard.mjs $tool
          if ($LASTEXITCODE -ne 0) { throw 'Real Omp guard check failed' }
          node scripts/test-omp-memory-guard.mjs $tool sub
          if ($LASTEXITCODE -ne 0) { throw 'Real Omp child guard check failed' }
      - name: Build production package and check portable entry
        shell: powershell
        run: ./scripts/build.ps1 -Output artifacts/ci-preview
      - name: Check production F12 and Enter in real Terminal
        shell: powershell
        run: ./scripts/test-production-pane.ps1 -PackageDirectory artifacts/ci-preview
      - name: Preserve gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics
          path: |
            artifacts/ci-diagnostics
            artifacts/ui/*.json
            artifacts/prototype-browser-results.json
            artifacts/prototype-browser-stderr.log
            artifacts/ci-preview/distribution.json
            artifacts/production-pane-*/result.json
            artifacts/omp-memory-guard-*/
          if-no-files-found: ignore
      # Release: zip the verified portable package and publish it for main commits only.
      - name: Zip portable preview package
        id: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'artifacts/ci-preview'
          if (-not (Test-Path -LiteralPath (Join-Path $package 'distribution.json'))) { throw "Preview package not found: $package" }
          $sha8 = $env:GITHUB_SHA.Substring(0,8)
          $zip = "artifacts/agent-launcher-$sha8.zip"
          Get-ChildItem -LiteralPath $package | Compress-Archive -DestinationPath $zip -Force
          if (-not (Test-Path -LiteralPath $zip)) { throw "Zip was not created: $zip" }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sha8=$sha8`n", [Text.UTF8Encoding]::new($false))
          Write-Output "Zipped $package to $zip"
      - name: Upload agent-launcher zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agent-launcher-${{ steps.package.outputs.sha8 }}
          path: artifacts/agent-launcher-${{ steps.package.outputs.sha8 }}.zip
          retention-days: 30
          if-no-files-found: error
