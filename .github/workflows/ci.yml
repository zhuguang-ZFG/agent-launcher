name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # F06/G1: real Pi npm shim is acceptance coverage; pin the version verified locally.
      - name: Install real Pi CLI
        shell: pwsh
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.0
      - name: Diagnose pi shim
        shell: pwsh
        run: |
          $cmd="$env:NPM_CONFIG_PREFIX\pi.cmd"; if(-not(Test-Path $cmd)){$cmd="C:\npm\prefix\pi.cmd"}; "pi.cmd=$cmd exists=$(Test-Path $cmd)"
          Get-Content $cmd -Raw
          $entry=Join-Path (Split-Path $cmd) 'node_modules\@earendil-works\pi-coding-agent\dist\bundle\cli.js';"entryExists=$(Test-Path $entry)"
          $env:PATH -split ';' | Where-Object {$_ -and (Test-Path (Join-Path $_.Trim('"') 'pi.cmd'))} | ForEach-Object {"pi.cmd also in: $_"}
      - name: Full gate (model + integration + WPF + prototype + browser)
        shell: pwsh
        run: ./scripts/test.ps1
